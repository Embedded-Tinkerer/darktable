name: PhotographyLAB AppImage

# builds the Qt front end as one runnable Linux file on every push to its
# branch, and publishes it as the "photographylab-nightly" prerelease

on:
  push:
    branches:
      - claude/project-thread-zu0xhj
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photographylab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    if: github.repository != 'darktable-org/darktable'
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential cmake ninja-build git intltool xsltproc gettext \
            desktop-file-utils wget file libfuse2t64 \
            libgtk-3-dev libxml2-dev libxml2-utils liblensfun-dev liblensfun-bin \
            librsvg2-dev libsqlite3-dev libcurl4-gnutls-dev libjpeg-dev libtiff-dev \
            liblcms2-dev libjson-glib-dev libexiv2-dev libpugixml-dev libpng-dev \
            libopenjp2-7-dev libgphoto2-dev libsecret-1-dev libheif-dev libavif-dev \
            libwebp-dev libjxl-dev libimath-dev libopenexr-dev zlib1g-dev \
            libpotrace-dev libarchive-dev libmarisa-dev libcolord-dev \
            libcolord-gtk-dev libcups2-dev libinih-dev libomp-dev llvm clang \
            qt6-base-dev qt6-declarative-dev qt6-wayland \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs qml6-module-qtqml-workerscript \
            qml6-module-qtquick-templates

      - name: Update lens profiles
        run: sudo lensfun-update-data || true

      - uses: actions/checkout@v4
        with:
          # the version comes from git describe: AI model downloads are matched
          # to darktable's release number, and a bare hash matches none
          fetch-depth: 0

      - name: Fetch darktable release tags
        run: |
          git fetch --no-tags https://github.com/darktable-org/darktable.git \
            '+refs/tags/release-*:refs/tags/release-*' || true
          ./tools/get_git_version_string.sh

      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 \
            src/external/rawspeed src/external/LibRaw src/external/whereami \
            src/external/OpenCL src/external/libxcf

      # the runner's token gets "release not found" from the GitHub API for
      # microsoft/onnxruntime, which stops FindONNXRuntime.cmake's download
      # (it fetches a checksum there first), and Ubuntu 24.04 has no
      # libonnxruntime-dev, so the archive is fetched by its plain download
      # URL; the find module looks in src/external/onnxruntime first
      - name: Fetch ONNX Runtime
        run: |
          ver=$(sed -n 's/^set(ONNXRUNTIME_VERSION "\([^"]*\)".*/\1/p' cmake/modules/FindONNXRuntime.cmake)
          pkg=onnxruntime-linux-x64-$ver.tgz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$pkg" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ver/$pkg"
          sha256sum "$RUNNER_TEMP/$pkg"
          mkdir -p src/external/onnxruntime
          tar -xzf "$RUNNER_TEMP/$pkg" -C src/external/onnxruntime --strip-components=1
          ls src/external/onnxruntime/lib

      - name: Build AppImage
        run: ./packaging/photographylab/build-appimage.sh

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete photographylab-nightly --cleanup-tag --yes || true
          gh release create photographylab-nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "PhotographyLAB (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download the .AppImage, make it executable (chmod +x, or Properties > Allow executing), and run it. Needs glibc 2.39 or newer (Ubuntu 24.04, Fedora 40, Debian 13)." \
            build-plab/PhotographyLAB-*.AppImage
